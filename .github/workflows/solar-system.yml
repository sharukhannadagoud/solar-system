
name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

permissions:
  contents: read

jobs:
  unit-testing:
    name: Unit Testing

    strategy:
      fail-fast: false
      matrix:
        nodejs_version: [18, 20]
        operating_systems: [ubuntu-latest, macos-latest]
        exclude:
          - nodejs_version: 18
            operating_systems: macos-latest

    runs-on: ${{ matrix.operating_systems }}

    env:
      MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
      MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup NodeJS Version
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.nodejs_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Unit Testing
        id: unit-testing-id
        run: npm test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-test-results-${{ matrix.nodejs_version }}-${{ matrix.operating_systems }}
          path: test-results.xml
          if-no-files-found: warn

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    env:
      MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
      MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup NodeJS Version
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Coverage
        run: npm run coverage

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            coverage/
            test-results.xml
          if-no-files-found: warn

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
      MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build For Testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images

          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI="$MONGO_URI" \
            -e MONGO_USERNAME="$MONGO_USERNAME" \
            -e MONGO_PASSWORD="$MONGO_PASSWORD" \
            "${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"

          for i in {1..30}; do
            if wget -q -O - http://127.0.0.1:3000/live | grep -q live; then
              echo "Container health check passed"
              docker rm -f solar-system-app
              exit 0
            fi
            sleep 2
          done

          echo "Container health check failed"
          docker logs solar-system-app
          docker rm -f solar-system-app
          exit 1

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}